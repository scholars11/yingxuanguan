name: build-release

# 触发方式：
#   1. 推送 v 开头的标签（如 v1.0.0）→ 自动构建并发布到 GitHub Releases
#   2. 仓库 Actions 页面手动 Run workflow（可填服务器地址做测试包）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # 手动触发无需任何参数（安卓用原生 HTTP 直连 API，绕过 CORS，不需要云端代理）

permissions:
  contents: write

jobs:
  # ---------------- Windows 电脑版 exe ----------------
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: 安装依赖
        run: npm ci

      - name: 生成图标
        run: npm run gen:icons

      - name: 打包 exe（安装版 + 免安装版）
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YingXuanGuan-Windows-v${{ steps.ver.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 影序馆 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.exe

  # ---------------- Android 手机 + TV 通用 APK ----------------
  android:
    name: Android 手机/TV 安装包
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 固定调试签名密钥（保证每次出的 APK 可覆盖升级）
        uses: actions/cache@v4
        id: keystore
        with:
          path: ~/.android/debug.keystore
          key: yxg-debug-keystore-v1

      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 安装依赖
        run: npm ci

      - name: 生成图标
        run: npm run gen:icons

      - name: 生成网页资源（www）
        run: npm run www

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 生成应用图标与启动屏
        run: npx --yes @capacitor/assets generate --android

      - name: 注入 Android TV 支持
        run: npm run cap:tv

      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理产物名称
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/YingXuanGuan-Android-PhoneTV-v${{ steps.ver.outputs.version }}.apk
          ls -lh release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YingXuanGuan-Android-v${{ steps.ver.outputs.version }}
          path: release/*.apk
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 影序馆 ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
