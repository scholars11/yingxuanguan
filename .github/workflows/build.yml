name: build-release

# 触发方式：
#   1. 推送 v 开头的标签（如 v1.0.0）→ 自动构建并发布到 GitHub Releases
#   2. 仓库 Actions 页面手动 Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- Windows 电脑版 exe ----------------
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: 安装依赖
        run: npm ci

      - name: 生成图标
        run: npm run gen:icons

      - name: 打包 exe（安装版 + 免安装版）
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YingXuanGuan-Windows-v${{ steps.ver.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 影序馆 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.exe
